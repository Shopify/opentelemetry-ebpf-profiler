# Sample OpenTelemetry Collector configuration running the profiling receiver and
# exporting the corresponding profiles to the http://127.0.0.1:11000 OTLP
# endpoint. Note that the service.profilesSupport feature gate must be enabled
# (e.g. using --feature-gates=+service.profilesSupport CLI argument)
#
# The profiling receiver requires elevated privileges because it relies on
# low-level OS instrumentation (e.g. eBPF, or ptrace). On Linux, this means
# running the Collector as root (sudo) or granting specific capabilities such
# as CAP_SYS_ADMIN, CAP_PERFMON, and/or CAP_BPF, as well as access to /proc.
#
# When running in containers or Kubernetes:
#   - hostPID: true
#   - privileged: true or explicitly adding the required Linux capabilities
#   - mounting kernel-related filesystems (e.g. /sys, /proc) as needed
receivers:
  profiling:
    # Experimental I/O and network latency profiles. Each sample carries the
    # operation's elapsed nanoseconds and its attributed stack.
    # async_correlation_capacity: 16384
    # async_correlation_ttl: 5m
    # custom_probes:
    #   # Submission-to-CQE latency. Request correlation preserves the submitter's
    #   # stack and process attribution across workers, CPUs, and multishot CQEs.
    #   io_uring_latency:
    #     min_duration: 100us
    #     sample_rate: 0.1
    #   # Linux 5.19+; block_io_start -> block_rq_issue, matching biostacks.bt.
    #   # This asynchronous profile attributes latency to the initiating kernel stack.
    #   block_io_queue_latency:
    #     min_duration: 100us
    #     sample_rate: 0.1
    #   # Synchronous function profiles include both kernel and user stacks.
    #   tcp_send_latency:
    #     min_duration: 100us
    #     sample_rate: 0.1
    #   tcp_receive_latency:
    #     min_duration: 100us
    #   vfs_read_latency:
    #     min_duration: 1ms
    #   vfs_write_latency:
    #     min_duration: 1ms

exporters:
  otlp/local:
    # equivalent to -collection-agent deprecated cli flag
    endpoint: http://127.0.0.1:11000
    # equivalent to -disable-tls deprecated cli flag
    tls:
      insecure: true
      insecure_skip_verify: true


service:
  telemetry:
    logs:
      level: info
      # equivalent to -verbose_mode deprecated cli flag
      # level: debug
    # metrics:
    #   level: detailed
    #   readers:
    #     - pull:
    #         exporter:
    #           prometheus:
    #             host: '0.0.0.0'
    #             port: 8888
  pipelines:
    profiles:
      receivers: [profiling]
      exporters: [otlp/local]
