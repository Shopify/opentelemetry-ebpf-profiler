vmType: qemu
arch: x86_64
images:
  - location: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
cpus: 2
memory: 3GiB
disk: 12GiB
mounts:
  - location: <audit-dir>
    mountPoint: /audit
    writable: true
mountType: 9p
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
containerd:
  system: false
  user: false
networks: []
hostResolver:
  enabled: false
dns: [8.8.8.8, 1.1.1.1]
firmware:
  legacyBIOS: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdb libgmp10 libcrypt1
